<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumen Store — Checkout</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 44rem; margin: 0 auto; padding: 1.5rem; color: #1c2420; }
      fieldset { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 1rem; padding: 1rem; }
      legend { font-weight: 600; }
      .field { margin-bottom: 0.75rem; }
      label { display: block; font-size: 0.9rem; }
      .icon-button { padding: 0.35rem 0.5rem; }
      .summary { background: #f2f6f3; padding: 1rem; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>Checkout</h1>

    <form action="/checkout" method="post">
      <fieldset>
        <legend>Contact</legend>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" name="email" autocomplete="email" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Payment</legend>
        <div class="field">
          <label for="card">Card number</label>
          <input id="card" type="text" name="card" inputmode="numeric" autocomplete="cc-number" />
        </div>
        <div class="field">
          <label for="expiry">Expiry date</label>
          <input id="expiry" type="text" name="expiry" autocomplete="cc-exp" />
        </div>
        <!-- Deliberate defect: placeholder used instead of a label. -->
        <div class="field">
          <input id="promo" type="text" name="promo" placeholder="Promo code" />
        </div>
      </fieldset>

      <div class="summary">
        <h2>Order summary</h2>
        <p>1 item · £24.00</p>
        <!-- Deliberate defect: vague link with nearby clarifying text. -->
        <p>Questions about delivery? <a href="/help/delivery-options">More</a></p>
        <!-- Deliberate defect: destructive icon control with no name. -->
        <button class="icon-button" type="button">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" /></svg>
        </button>
      </div>

      <button type="submit">Place order</button>
      <button type="button" aria-label="Save order for later">Save for later</button>
    </form>

    <section hidden>
      <button type="button"></button>
      <a href="/hidden-offer"></a>
    </section>
  </body>
</html>
